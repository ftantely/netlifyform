<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Netlify reCAPTCHA Form</title>
	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			max-width: 600px;
			margin: 0 auto;
			padding: 2rem;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			min-height: 100vh;
		}
		
		.form-container {
			background: white;
			padding: 2rem;
			border-radius: 12px;
			box-shadow: 0 20px 40px rgba(0,0,0,0.1);
		}
		
		h1 {
			color: #333;
			margin-bottom: 1.5rem;
			text-align: center;
		}
		
		.form-group {
			margin-bottom: 1.5rem;
		}
		
		label {
			display: block;
			margin-bottom: 0.5rem;
			color: #555;
			font-weight: 500;
		}
		
		input[type="text"],
		input[type="email"],
		textarea {
			width: 100%;
			padding: 0.75rem;
			border: 2px solid #e1e5e9;
			border-radius: 6px;
			font-size: 1rem;
			transition: border-color 0.3s ease;
			box-sizing: border-box;
		}
		
		input[type="text"]:focus,
		input[type="email"]:focus,
		textarea:focus {
			outline: none;
			border-color: #667eea;
		}
		
		textarea {
			resize: vertical;
			min-height: 100px;
		}
		
		.recaptcha-container {
			margin: 1.5rem 0;
			text-align: center;
		}
		
		button {
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: white;
			border: none;
			padding: 1rem 2rem;
			border-radius: 6px;
			font-size: 1rem;
			font-weight: 600;
			cursor: pointer;
			transition: transform 0.2s ease, box-shadow 0.2s ease;
			width: 100%;
		}
		
		button:hover {
			transform: translateY(-2px);
			box-shadow: 0 10px 20px rgba(0,0,0,0.1);
		}
		
		.info-box {
			background: #f8f9fa;
			border-left: 4px solid #667eea;
			padding: 1rem;
			margin: 2rem 0;
			border-radius: 0 6px 6px 0;
		}
		
		.info-box h3 {
			margin: 0 0 0.5rem 0;
			color: #333;
		}
		
		.info-box p {
			margin: 0;
			color: #666;
			line-height: 1.5;
		}
	</style>
</head>
<body>
<div class="form-container">
	<h1>Contact Form with reCAPTCHA</h1>
	
	<div class="info-box">
		<h3>Netlify-Provided reCAPTCHA</h3>
		<p>This form uses Netlify's built-in reCAPTCHA v2 integration. The reCAPTCHA widget will automatically appear when the site is deployed to Netlify.</p>
	</div>
	
	<!-- Netlify Form with reCAPTCHA -->
	<form name="contact" method="POST" data-netlify-recaptcha="true" data-netlify="true">
		<div class="form-group">
			<label for="name">Name:</label>
			<input type="text" id="name" name="name" required>
		</div>
		
		<div class="form-group">
			<label for="email">Email:</label>
			<input type="email" id="email" name="email" required>
		</div>
		
		<div class="form-group">
			<label for="subject">Subject:</label>
			<input type="text" id="subject" name="subject" required>
		</div>
		
		<div class="form-group">
			<label for="message">Message:</label>
			<textarea id="message" name="message" required></textarea>
		</div>
		
		<!-- reCAPTCHA will appear here when deployed to Netlify -->
		<div class="recaptcha-container">
			<div data-netlify-recaptcha="true"></div>
		</div>
		
		<button type="submit">Send Message</button>
	</form>
	
	<!-- Hidden form for JavaScript frameworks (if needed) -->
	<form name="contact" netlify netlify-honeypot="bot-field" hidden>
		<input type="text" name="name" />
		<input type="email" name="email" />
		<input type="text" name="subject" />
		<textarea name="message"></textarea>
	</form>
</div>
</body>
</html>
